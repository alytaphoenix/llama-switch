# llama-swap config template. Deployed to ~/llama-switch/etc/llama-swap.yaml
# by scripts/deploy.sh, which renders @HOME@ to the remote $HOME.
#
# Two engines serve the API port; llama-swap swaps between them on demand.
# Both entries below use gufo (a local build for the flagship, the upstream
# container for the 27B). Edit the model paths, quant files, and speculative
# decoders to match your weights, then run scripts/deploy.sh.
#
# NOTE: multi-line `cmd` strings are exec'd directly (no shell), so each
# continued line MUST end with a trailing backslash — without it every line
# runs as a separate command and the upstream starts in an empty router mode.

healthCheckTimeout: 120
logLevel: info
logToStdout: "proxy,upstream"
startPort: 9801

models:
  # ------------------------------------------------- large flagship
  # gufo local build (weights -> hipMallocManaged, device pool for session state)
  "gufo-flash-next":
    cmd: |
      @HOME@/src/gufo/build/release/gufo serve --host 127.0.0.1 --port ${PORT} llm \
        --model @HOME@/llama-switch/models/unsloth/Qwen3.8-Flash-Next-GGUF/UD-Q4_K_XL/Qwen3.8-Flash-Next-UD-Q4_K_XL-00001-of-00004.gguf \
        --speculative mtp \
        --mtp-model @HOME@/llama-switch/models/unsloth/MTP-shared/MTP/mtp-Qwen3.8-Flash-Next-shared-Q8_0.gguf \
        --sessions 1 --context 262144
    env:
      - LD_LIBRARY_PATH=/opt/rocm/lib
    useModelName: "Qwen3.8 Flash Next"
    aliases:
      - flash-next
    ttl: 900

  # ------------------------------------------------------- 27B daily driver
  # gufo upstream container (mapped-GGUF placement fits the device pool)
  "gufo-27b-q4":
    cmd: |
      podman run --rm --name gufo-27b-q4 \
        --userns=keep-id:uid=1000,gid=1000 \
        --device /dev/kfd --device /dev/dri --group-add keep-groups \
        --ulimit memlock=-1 \
        -p 127.0.0.1:${PORT}:8080 \
        -v @HOME@/llama-switch/models:/models:ro \
        ghcr.io/gufo-org/toolboxes/gufo-runtime:latest \
        gufo serve --host 0.0.0.0 --port 8080 llm \
        --model /models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-UD-Q4_K_XL.gguf \
        --speculative dflash2 \
        --dflash-model /models/z-lab/Qwen3.8-27B-DFlash2-GGUF/Qwen3.8-27B-DFlash2-Q4_K_M.gguf \
        --sessions 2 --context 65536
    cmdStop: podman rm -f gufo-27b-q4
    env:
      - LD_LIBRARY_PATH=/opt/rocm/lib
    useModelName: "Qwen3.8-27B"
    aliases:
      - 27b
    ttl: 900

groups:
  "big":
    swap: true
    members:
      - gufo-flash-next
      - gufo-27b-q4
